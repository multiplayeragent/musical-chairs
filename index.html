<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Musical Chairs</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #3a2340; }
  body { font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; }
  .hud { position: fixed; pointer-events: none; text-shadow: 0 2px 4px #0009; font-weight: 800; }
  #top { top: max(10px, env(safe-area-inset-top)); left: 0; right: 0; text-align: center; font-size: 22px; padding: 0 12px; }
  #top small { display: block; font-size: 14px; font-weight: 700; opacity: .9; letter-spacing: .5px; }
  #top.stop { color: #ffe066; }
  #big { inset: 0; display: grid; place-items: center; text-align: center; font-size: min(15vw, 104px); line-height: 1; color: #fff; -webkit-text-stroke: 3px #c2185b; padding: 0 16px; }
  #big.good { -webkit-text-stroke-color: #1f8a55; }
  #big small { display: block; font-size: min(5vw, 22px); -webkit-text-stroke: 0; margin-top: 12px; }
  #msg { left: 16px; right: 16px; bottom: calc(max(14px, env(safe-area-inset-bottom)) + 30px); text-align: center; font-size: 16px; }
  #net { bottom: max(10px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); font-size: 12px; font-weight: 600; opacity: .85; white-space: nowrap; }
  #over { position: fixed; inset: 0; display: grid; place-items: center; background: #1d0f2266; }

  .card { width: min(380px, calc(100vw - 32px)); max-height: 86vh; overflow: auto; padding: 20px; border-radius: 18px; background: #4a2550; border: 2px solid #ffffff33; box-sizing: border-box; }
  .card h2 { margin: 0 0 4px; font-size: 24px; color: #ffe066; }
  .card h3 { margin: 14px 0 4px; font-size: 14px; color: #ffb3d1; }
  .card ol { margin: 0; padding-left: 24px; font-size: 14px; }
  .card li span { float: right; font-variant-numeric: tabular-nums; opacity: .85; }
  .card li.me { color: #ffe066; font-weight: 700; }
  .card p { margin: 6px 0 0; font-size: 14px; opacity: .9; }
  button.go { margin-top: 16px; width: 100%; min-height: 48px; border: 0; border-radius: 12px; background: #ffe066; color: #4a2550; font: 800 17px system-ui, sans-serif; cursor: pointer; }
  #bump { position: fixed; right: max(18px, env(safe-area-inset-right)); bottom: max(26px, env(safe-area-inset-bottom)); width: 88px; height: 88px; border-radius: 50%;
          border: 3px solid #ffffffaa; background: #ff4f9a99; color: #fff; font: 800 16px system-ui, sans-serif; touch-action: none; }
  #bump.wait { opacity: .45; }
</style>
<script src="https://cdn.multiplayeragent.com/sdk/mp.global.js"></script>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud" id="top"></div>
<div class="hud" id="big"></div>
<div class="hud" id="msg"></div>
<div class="hud" id="net">Connecting…</div>
<button id="bump" hidden>BUMP</button>
<div id="over" hidden><div class="card">
  <h2 id="overTitle"></h2><p id="overLine"></p>
  <h3>This game</h3><ol id="results"></ol>
  <h3>Most wins</h3><ol id="board"><li>Loading…</li></ol>
  <button class="go" id="again">Play again</button>
  <p id="next"></p>
</div></div>
<script>
/* ═══ MUSICAL CHAIRS · a Multiplayer Agent starter ═════════════════════════════════════
 * Walk round the chairs while the music plays. When it stops, grab a seat! One chair fewer
 * every round; whoever is left standing is out. Last one sitting wins. Party, 3–12 players.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ walk and scramble timings, speeds, the bump, how close counts as a seat, bots
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   ROOM .......... where the chairs, the walking ring and the spectators are (they shrink
 *                   with the number of chairs)
 *   MUSIC ......... the seeded party tune (WebAudio), started and cut on the shared clock
 *   GAME (HOST) ... brief → walk → scramble → result … → over: when the music stops, who gets
 *                   which seat, who is out, the winner. Only the host writes these.
 *   BOTS .......... bots stroll, hurry, bump, and dash for a chair a moment after the music stops
 *                   (the host runs them; in ?attract the same brain drives you)
 *   ME ............ walking, dashing, bumping, getting bumped. Each player writes only its own.
 *   DRAW .......... the floor, rug, disco lights, chairs, the boombox, the players
 *   HUD & RESULTS . round line, big words, results card, leaderboard
 *   INPUT ......... keyboard, mouse, touch and the Bump button
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - Each player writes its OWN entity: `p` (one packed JSON field: game id, position,
 *     heading, animation, bump count) about 12 times a second, `hb` (heartbeat) once a
 *     second, and `n`/`c` (name, color) once.
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last 3s),
 *     worked out every frame. Only the host writes the shared fields `game` (id, v, phase,
 *     round, music seed and start, stopAt, chairs, who is still in, who sits where, who went
 *     out) and `bots` (~10 times a second). A new host adopts both and carries on.
 *   - The music stop is a timestamp: the host picks it secretly and writes `stopAt` a
 *     quarter of a second before it happens, so every player's music cuts at the same moment.
 *   - Seats are HOST-RUN: touching a free chair sends the intent "sit" {g, r, c, x, y}. The
 *     host gives the chair to the first claim it receives; claims that land within tieMs of
 *     each other are a tie, won by whoever was closest to the chair. The host claims for itself
 *     and its bots through the same queue.
 *   - Bumping needs no intent: a bumping player publishes animation 2 and a bump count; anyone
 *     it runs into knocks ITSELF back (the host does it for bots).
 *   - "again" asks the host to start the next game sooner.
 *   - ?attract plays offline with bots only (the preview video is recorded from it).
 *   - Leaderboard "chair-wins": games won (submitted with "inc"), on the results card.
 */

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {
  seats: 8,              // bots fill the game up to this many players
  briefMs: 3000,         // everyone takes a look at the chairs before the first song
  walkMs: [5000, 12000], // the music plays this long (random, secret until it stops)
  botsOnlyWalkMs: [1600, 3200], // ...shorter once every person is out
  stopLeadMs: 250,       // the host announces the stop this long before it happens
  scrambleMs: 7000,      // after the music stops: anyone still standing after this is out
  resultMs: 2600,        // who went out, before the next song
  overMs: 10000,         // results card before the next game
  tieMs: 120,            // claims for one chair that arrive this close together are a tie...
  reach: 0.75,           // ...a chair counts as reached this close (units; a player is ~0.84 wide)
  slack: 1.6,            // the host refuses a claim from further away than reach + this
  stroll: 1.8,           // walking speed round the chairs, units/s
  hurry: 3.1,            // ...while you hold a key, the mouse or the screen
  run: 5.6,              // dash speed once the music stops
  accel: 16,             // how quickly you reach the speed you want
  bumpSpeed: 2.3,        // a bump lunges at this many times your speed...
  bumpMs: 200,           // ...for this long
  bumpCooldown: 1500,    // ms before you can bump again
  bumpPower: 9,          // how hard a bump knocks someone (units/s)
  dizzyMs: 450,          // a bumped player can't steer for this long
  radius: 0.42,          // a player's radius
  botReact: [220, 700],  // ms before a bot notices the music stopped
  botBump: 0.5,          // how often a bot bumps when someone is in the way (0..1)
  board: "chair-wins",
};
const BOT_NAMES = ["Pip", "Mabel", "Ziggy", "Bean", "Lulu", "Taffy", "Rollo", "Fig", "Nova", "Bobo", "Kiki", "Moss"];
const COLORS = ["#ff5d8f", "#4dabff", "#ffd23f", "#3fd08a", "#b77dff", "#ff8c42", "#3fd6d0", "#ff6f61", "#a3e635", "#f9a8d4", "#60a5fa", "#fbbf24"];

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'musical-chairs',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',
};
const QS = new URLSearchParams(location.search), ATTRACT = QS.has("attract");
if (ATTRACT) Object.assign(CONFIG, { seats: 9, briefMs: 500, walkMs: [2200, 3200], botsOnlyWalkMs: [2200, 3200], resultMs: 1100, overMs: 2000, botReact: [150, 520], botBump: 0.8 });

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {
  const id = "local", state = { entities: { players: { [id]: {} } }, shared: {} }, subs = [];
  let queued = false;
  const emit = () => { if (!queued) { queued = true; queueMicrotask(() => { queued = false; subs.forEach((f) => f(state)); }); } };
  const put = (o, k, v) => { if (typeof k === "object") Object.assign(o, k); else o[k] = v; emit(); };
  return {
    sessionId: id, state, offline: true,
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),
    onState: (f) => { subs.push(f); f(state); }, onJoin() {}, onLeave() {}, on() {}, send() {},
    onDisconnect() {}, onReconnect() {}, leave: async () => {},
  };
}
async function connect() {
  if (ATTRACT || typeof MP === "undefined") return localRoom();
  try {
    const mp = await Promise.race([MP.join({ ...MP_CONNECT }), new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);
    window.mp = mp; // the builder calls window.mp.leave() when the page closes
    return mp;
  } catch (e) {
    console.warn("Playing offline:", e && e.message);
    return localRoom();
  }
}
const parse = (v, fb) => { if (typeof v !== "string") return fb; try { return JSON.parse(v); } catch { return fb; } };
const memo = new Map();
/** A shared JSON field, parsed once per change (read-only: never mutate what this returns). */
function shared(key, fb) { const raw = S.shared[key], m = memo.get(key); if (m && m.raw === raw) return m.v; const v = parse(raw, fb); memo.set(key, { raw, v }); return v; }
let net = null, S = { entities: { players: {} }, shared: {} };
const seenHb = new Map();
function livePlayers() {
  const now = performance.now(), out = [];
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });
    if (id === net.sessionId || now - seenHb.get(id).at < 3000) out.push(id);
  }
  return out.sort();
}
let hostHold = 0, lastTick = performance.now(); // lastTick: when frame() last ran; hostHold: after a freeze, no hosting before this time (see frame())
const isHost = () => performance.now() > hostHold && performance.now() - lastTick < 1000 && livePlayers()[0] === net.sessionId; // a tab whose loop has stopped doesn't host
const isBot = (id) => id[0] === "@"; // bot ids look like "@3"; sessionIds never have an @

// ── ROOM ────────────────────────────────────────────────────────────────────────────
// The chairs stand in a ring round the boombox, facing out. Players walk a ring just outside
// them; players who are out cheer from a ring further out. All of it shrinks as chairs go.
const R = CONFIG.radius;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const rnd = (r) => r[0] + Math.random() * (r[1] - r[0]);
const clone = (o) => JSON.parse(JSON.stringify(o));
const hash = (s) => [...String(s)].reduce((n, ch) => (n * 31 + ch.charCodeAt(0)) >>> 0, 7);
const chairRing = (n) => Math.max(1.3, (n * 1.4) / (Math.PI * 2));
const laneRing = (n) => chairRing(n) + 1.35;
const crowdRing = (n) => laneRing(n) + 1.3;
/** Where chair i of n stands, and which way it faces (out from the middle). The seed turns the ring. */
function chairPos(i, n, seed) { const a = ((seed % 360) * Math.PI) / 180 + (i / n) * Math.PI * 2, r = chairRing(n); return { x: Math.cos(a) * r, y: Math.sin(a) * r, a }; }
const crowdSpot = (id, n) => { const a = (hash(id) % 360) * (Math.PI / 180); return { x: Math.cos(a) * crowdRing(n), y: Math.sin(a) * crowdRing(n) }; };
function mulberry32(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

// ── MUSIC ───────────────────────────────────────────────────────────────────────────
// Every song comes from the round's seed: tempo, key, a bouncy bass, chord stabs, hats and a
// melody. It is scheduled from game.t0 on the shared clock and cut at game.stopAt.
let AC = null, noise = null;
function unlockAudio() {
  if (AC || ATTRACT) return;
  try {
    AC = new AudioContext();
    noise = AC.createBuffer(1, AC.sampleRate * 0.5, AC.sampleRate);
    const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch { AC = null; }
}
const hz = (m) => 440 * Math.pow(2, (m - 69) / 12);
const PROG = [0, 7, 9, 5]; // I V vi IV
const songMemo = new Map();
function songOf(seed) {
  if (songMemo.has(seed)) return songMemo.get(seed);
  const r = mulberry32(seed), PENTA = [0, 2, 4, 7, 9, 12, 14, 16];
  const song = { bpm: 116 + Math.floor(r() * 5) * 8, root: 53 + Math.floor(r() * 6), mel: [] };
  for (let s = 0; s < 32; s++) song.mel.push(s % 2 === 0 && r() < 0.8 ? PENTA[Math.floor(r() * PENTA.length)] : s % 2 === 1 && r() < 0.25 ? PENTA[Math.floor(r() * PENTA.length)] : -1); // 8ths over 4 bars
  song.step = 60000 / song.bpm / 2; // ms per 8th note
  songMemo.set(seed, song); return song;
}
const music = { key: "", next: 0, out: null };
function voice(type, f, at, len, vol, out) {
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, at);
  g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(vol, at + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, at + len);
  o.connect(g).connect(out); o.start(at); o.stop(at + len + 0.05);
}
function hat(at, out) { const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain(); s.buffer = noise; f.type = "highpass"; f.frequency.value = 7000; g.gain.setValueAtTime(0.08, at); g.gain.exponentialRampToValueAtTime(0.0001, at + 0.05); s.connect(f).connect(g).connect(out); s.start(at); s.stop(at + 0.06); }
/** Called every frame: queue the next notes ~0.15s ahead, never past the stop. */
function playMusic(g, t) {
  if (!AC || g.phase !== "walk") return;
  const song = songOf(g.seed), key = g.id + ":" + g.r, end = g.stopAt || Infinity;
  if (music.key !== key) { // a new song: a fresh output we can cut at the stop
    music.key = key; music.next = Math.max(0, Math.ceil((t - g.t0) / song.step)); music.cut = 0;
    music.out = AC.createGain(); music.out.gain.value = 0.5; music.out.connect(AC.destination);
  }
  if (g.stopAt && music.cut !== g.stopAt) { music.cut = g.stopAt; const at = AC.currentTime + Math.max(0, (g.stopAt - t) / 1000); music.out.gain.setValueAtTime(0.5, at); music.out.gain.linearRampToValueAtTime(0, at + 0.03); }
  for (let st = g.t0 + music.next * song.step; st < t + 150 && st < end; st = g.t0 + ++music.next * song.step) {
    if (st < t - 30) continue;
    const at = AC.currentTime + (st - t) / 1000, i = music.next, bar = Math.floor(i / 8) % 4, chord = song.root + PROG[bar], beat = i % 8, out = music.out;
    if (beat % 2 === 0) voice("triangle", hz(chord - 12 + (beat % 4 === 2 ? 7 : 0)), at, 0.18, 0.35, out); // oom
    if (beat % 2 === 1) for (const x of [0, 4, 7]) voice("square", hz(chord + 12 + x), at, 0.09, 0.025, out); // pah
    hat(at, out);
    const m = song.mel[i % 32];
    if (m >= 0) voice("square", hz(song.root + 24 + m), at, song.step / 1000 * 0.9, 0.05, out);
  }
}
function sfx(kind) {
  if (!AC) return;
  const t = AC.currentTime, tone = (f0, f1, len, type, vol, d = 0) => { const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.setValueAtTime(f0, t + d); o.frequency.exponentialRampToValueAtTime(f1, t + d + len); g.gain.setValueAtTime(0.0001, t); g.gain.setValueAtTime(vol, t + d); g.gain.exponentialRampToValueAtTime(0.001, t + d + len); o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d + len + 0.02); };
  if (kind === "scratch") { tone(900, 120, 0.25, "sawtooth", 0.1); tone(300, 60, 0.3, "square", 0.05, 0.05); }
  if (kind === "sit") tone(220, 140, 0.12, "triangle", 0.25);
  if (kind === "mine") { tone(523, 523, 0.12, "triangle", 0.15); tone(784, 784, 0.25, "triangle", 0.15, 0.1); }
  if (kind === "bonk") tone(420, 160, 0.14, "square", 0.08);
  if (kind === "whoosh") tone(300, 700, 0.12, "triangle", 0.06);
  if (kind === "out") { tone(392, 370, 0.25, "sawtooth", 0.07); tone(370, 349, 0.25, "sawtooth", 0.07, 0.25); tone(349, 260, 0.6, "sawtooth", 0.07, 0.5); }
  if (kind === "win") { tone(523, 523, 0.15, "triangle", 0.15); tone(659, 659, 0.15, "triangle", 0.15, 0.13); tone(784, 784, 0.15, "triangle", 0.15, 0.26); tone(1047, 1047, 0.5, "triangle", 0.15, 0.39); }
}

// ── GAME (HOST) ─────────────────────────────────────────────────────────────────────
const host = { was: false, last: null, bots: new Map(), lastPub: 0, again: false, plan: { key: "", at: 0 }, claims: new Map() };
/** The game as state has it, or the host's own newer write that hasn't come back yet. `v` only goes up. */
function game() { const g = shared("game", null); return host.last && isHost() && (!g || host.last.v > g.v) ? host.last : g; }
function writeGame(g) { g = { ...g, v: (game()?.v ?? 0) + 1 }; host.last = g; net.setShared("game", JSON.stringify(g)); return g; }
const newBody = () => ({ x: 0, y: 0, h: 0, vx: 0, vy: 0, kx: 0, ky: 0, a: 0, b: 0, bumpUntil: 0, bumpReady: 0, dizzyUntil: 0, hitBy: {}, hurry: false, hurryAt: 0, react: 0, tc: -1, think: 0 });
const seatOf = (g, id) => { for (const [c, who] of Object.entries(g.seat)) if (who === id) return +c; return -1; };
const isIn = (g, id) => g.alive.includes(id);
/** Has the music stopped? (Every player works it out from the same timestamp.) */
const stopped = (g, t) => g.phase === "scramble" || (g.phase === "walk" && g.stopAt > 0 && t >= g.stopAt);

function newGame(id) {
  const here = livePlayers(), seated = here.filter((h) => !(ATTRACT && h === net.sessionId)); // in ?attract your autopilot takes a bot's seat
  syncBots(Math.max(0, CONFIG.seats - seated.length - (ATTRACT ? 1 : 0)));
  const alive = [...here, ...host.bots.keys()], t = Date.now();
  for (const b of host.bots.values()) Object.assign(b, newBody(), laneSpot(alive.indexOf(b.id), alive.length, alive.length - 1));
  return writeGame({ id, phase: "brief", r: 1, seed: (Math.random() * 1e9) | 0, t0: t + CONFIG.briefMs, stopAt: 0, ends: t + CONFIG.briefMs, chairs: Math.max(1, alive.length - 1), alive, seat: {}, outs: [], out: [], win: "" });
}
const laneSpot = (i, n, chairs) => { const a = (i / Math.max(1, n)) * Math.PI * 2 + 0.3; return { x: Math.cos(a) * laneRing(chairs), y: Math.sin(a) * laneRing(chairs), h: a + Math.PI / 2 }; };
/** Become host: take over the game and the bots exactly as state has them. */
function adopt() {
  host.was = true; host.bots.clear(); host.claims.clear(); host.plan = { key: "", at: 0 };
  for (const b of shared("bots", [])) host.bots.set(b.i, { ...newBody(), id: b.i, name: b.n, color: b.c, x: b.x, y: b.y, h: b.h, b: b.b || 0 });
}
function syncBots(want) {
  for (let i = 1; host.bots.size < want && i < 64; i++) if (!host.bots.has("@" + i)) {
    const used = new Set([...host.bots.values()].map((b) => b.color).concat(livePlayers().map(colorOf)));
    host.bots.set("@" + i, { ...newBody(), id: "@" + i, name: BOT_NAMES[(i - 1) % BOT_NAMES.length], color: COLORS.find((c) => !used.has(c)) || COLORS[i % COLORS.length] });
  }
  while (host.bots.size > want) host.bots.delete([...host.bots.keys()].pop());
}
function botList() {
  if (!isHost()) return shared("bots", []);
  return [...host.bots.values()].map((b) => ({ i: b.id, n: b.name, c: b.color, x: +b.x.toFixed(2), y: +b.y.toFixed(2), h: +b.h.toFixed(2), a: b.a, b: b.b }));
}
const posCache = new Map();
/** Another player's packed `p` field, parsed once per change. */
function posOf(id, p) { let c = posCache.get(id); if (!c || c.raw !== p.p) { c = { raw: p.p, v: parse(p.p, null) }; posCache.set(id, c); } return c.v; }
/** Everyone in the room at their latest known spot: { id, name, color, x, y, h, a, b, bot, mine }. */
function people(g) {
  const out = [], live = new Set(livePlayers());
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    if (id === net.sessionId) { if (me.gameId === g.id) out.push({ id, name: myName, color: myColor, x: me.x, y: me.y, h: me.h, a: me.a, b: me.b, mine: true }); continue; }
    const q = posOf(id, p);
    if (live.has(id) && q && q.g === g.id) out.push({ id, name: p.n || "Player", color: p.c || "#ccc", x: q.x, y: q.y, h: q.h, a: q.a || 0, b: q.b || 0 });
  }
  if (isHost()) for (const b of host.bots.values()) out.push({ id: b.id, name: b.name, color: b.color, x: b.x, y: b.y, h: b.h, a: b.a, b: b.b, bot: true });
  else for (const b of botList()) out.push({ id: b.i, name: b.n, color: b.c, x: b.x, y: b.y, h: b.h, a: b.a, b: b.b, bot: true });
  return out;
}

function hostTick(dt, now) {

  for (let i = notesFx.length - 1; i >= 0; i--) { const n = notesFx[i]; n.life -= dt; if (n.life <= 0) { notesFx.splice(i, 1); continue; } n.y -= dt * 0.9; n.x += Math.sin(n.life * 4 + n.k) * dt * 0.4; ctx.globalAlpha = Math.min(1, n.life); ctx.fillStyle = n.col; ctx.fillText("♪", n.x, n.y); }
  ctx.globalAlpha = 1;
  // a white flash when the music stops
  const since = g.stopAt ? t - g.stopAt : -1;
  if (since >= 0 && since < 300) { ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.fillStyle = `rgba(255,255,255,${0.35 * (1 - since / 300)})`; ctx.fillRect(0, 0, W, H); }
}
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }
/** A chair seen from above: seat, backrest on the inside, four little legs. */
function drawChair(p, c, who) {
  ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a);
  ctx.fillStyle = "#00000040"; rr(-0.42, -0.4, 0.9, 0.9, 0.12); ctx.fill();
  ctx.fillStyle = who ? "#d8a2c6" : "#f4d6a0"; rr(-0.46, -0.45, 0.9, 0.9, 0.12); ctx.fill();
  ctx.strokeStyle = "#9b6a3a"; ctx.lineWidth = 0.05; ctx.stroke();
  ctx.fillStyle = "#b5773f"; rr(-0.58, -0.47, 0.16, 0.94, 0.06); ctx.fill(); // backrest (toward the middle)
  ctx.fillStyle = "#ffffff33"; rr(-0.3, -0.32, 0.6, 0.12, 0.05); ctx.fill();
  ctx.restore();
}
/** A round party critter seen from above: body, feet, eyes that look where it's heading. */
function drawPlayer(p, g, now) {
  const t = now / 1000, seated = p.seat >= 0, out = !p.in, k = (hash(p.id) % 100) / 16;
  ctx.save(); ctx.translate(p.x, p.y); ctx.globalAlpha = out ? 0.75 : 1;
  const r = R * (seated ? 0.92 : 1), bob = p.a === 1 ? Math.abs(Math.sin(t * 12 + k)) * 0.05 : p.a === 5 ? Math.abs(Math.sin(t * 8 + k)) * 0.12 : 0;
  ctx.fillStyle = "#00000040"; ctx.beginPath(); ctx.ellipse(0.05, 0.08, r, r * 0.85, 0, 0, Math.PI * 2); ctx.fill();
  ctx.rotate(p.h);
  if (!seated) for (const s of [-1, 1]) { const step = p.a === 1 || p.a === 2 ? Math.sin(t * 14 + k) * 0.14 * s : 0; ctx.fillStyle = "#3a2a4a"; ctx.beginPath(); ctx.ellipse(step, s * r * 0.55, 0.13, 0.09, 0, 0, Math.PI * 2); ctx.fill(); }
  if (p.a === 5) for (const s of [-1, 1]) { ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(Math.sin(t * 9 + k) * 0.12, s * (r + 0.12), 0.12, 0, Math.PI * 2); ctx.fill(); } // waving arms
  ctx.scale(1 + bob, 1 + bob);
  ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#00000055"; ctx.lineWidth = 0.05; ctx.stroke();
  ctx.fillStyle = "#ffffff55"; ctx.beginPath(); ctx.arc(-r * 0.3, -r * 0.3, r * 0.35, 0, Math.PI * 2); ctx.fill();
  if (p.a === 2) { ctx.strokeStyle = "#ffffffaa"; ctx.lineWidth = 0.06; for (const s of [-1, 0, 1]) { ctx.beginPath(); ctx.moveTo(-r - 0.1, s * 0.18); ctx.lineTo(-r - 0.45, s * 0.22); ctx.stroke(); } } // speed lines
  // eyes
  for (const s of [-1, 1]) {
    if (seated || p.a === 5) { ctx.strokeStyle = "#1b1030"; ctx.lineWidth = 0.06; ctx.beginPath(); ctx.arc(r * 0.35, s * r * 0.35, 0.08, Math.PI * 1.1 - Math.PI / 2, Math.PI * 1.9 - Math.PI / 2); ctx.stroke(); continue; }
    ctx.fillStyle = "#ffffff"; ctx.beginPath(); ctx.arc(r * 0.38, s * r * 0.35, 0.12, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#1b1030"; ctx.beginPath(); ctx.arc(r * 0.45, s * r * 0.35, p.a === 4 ? 0.03 : 0.06, 0, Math.PI * 2); ctx.fill();

  if (p.a === 4) for (let i = 0; i < 3; i++) { const a = t * 6 + (i * Math.PI * 2) / 3; ctx.fillStyle = "#ffe066"; ctx.font = "0.3px system-ui"; ctx.textAlign = "center"; ctx.fillText("★", p.x + Math.cos(a) * 0.4, p.y - 0.5 + Math.sin(a) * 0.15); }
  if (p.mine && !ATTRACT) { ctx.strokeStyle = "#ffffffcc"; ctx.lineWidth = 0.06; ctx.beginPath(); ctx.arc(p.x, p.y, R + 0.16 + Math.sin(t * 5) * 0.03, 0, Math.PI * 2); ctx.stroke(); }
}
function nameTag(p) {
  ctx.font = "800 0.32px system-ui, sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.lineWidth = 0.08; ctx.strokeStyle = "#000000aa"; const s = p.mine ? "You" : p.name.slice(0, 12);
  ctx.strokeText(s, p.x, p.y - R - 0.28); ctx.fillStyle = p.mine ? "#ffe066" : "#ffffff"; ctx.fillText(s, p.x, p.y - R - 0.28);
}

// ── HUD & RESULTS ───────────────────────────────────────────────────────────────────
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const local = { big: "", bigUntil: 0, good: false };
const bigText = (html, ms, good) => { local.big = html; local.bigUntil = performance.now() + ms; local.good = !!good; };
let board = null, boardFor = -1, reconnecting = false;
function hud(g, t) {
  const id = net.sessionId, isInNow = isIn(g, id), stop = stopped(g, t);
  if (ATTRACT) { for (const k of ["msg", "net"]) $(k).textContent = ""; $("big").innerHTML = performance.now() < local.bigUntil && local.big === "SIT!" ? "<div>SIT!</div>" : ""; $("top").className = "hud" + (stop ? " stop" : ""); $("top").innerHTML = g.phase === "over" ? "" : stop ? "SIT!" : g.phase === "walk" ? "♪ ♪ ♪" : ""; return; }
  $("top").className = "hud" + (stop && g.phase !== "result" ? " stop" : "");
  const chairs = `${g.chairs} chair${g.chairs === 1 ? "" : "s"} · ${g.alive.length} players left`;
  $("top").innerHTML = g.phase === "over" ? "" : g.phase === "brief" ? `Get ready…<small>${chairs}</small>`
    : g.phase === "result" ? `Round ${g.r}<small>${g.out.length ? g.out.map((o) => (o === id ? "You're" : esc(nameOf(o)) + " is")).join(", ") + " out!" : "Nobody out!"}</small>`
    : stop ? `SIT DOWN!<small>${chairs}</small>` : `♪ Round ${g.r} ♪<small>${chairs}</small>`;
  let big = performance.now() < local.bigUntil ? local.big : "", good = local.good;
  if (g.phase === "brief") { big = `${Math.max(1, Math.ceil((g.ends - t) / 1000))}<small>Walk round the chairs. When the music stops, sit!</small>`; good = true; }
  $("big").className = "hud" + (good ? " good" : "");
  $("big").innerHTML = big ? `<div>${big}</div>` : "";
  let msg = "";
  if (!isInNow && g.phase !== "over") msg = me.gameId === g.id && g.outs.some((o) => o[0] === id) ? "You're out! Cheer them on: next game soon." : "Game in progress: you hop in at the next song.";
  else if (g.phase === "walk" && !stop) msg = g.r > 1 ? (touchUI ? "Hold to hurry · BUMP to shove" : "Hold to hurry · Space to bump") : touchUI ? "Hold the screen to hurry · BUMP to shove · when the music stops, tap a chair" : "Hold any key or the mouse to hurry · Space to bump · when the music stops, click a chair (or WASD)";
  else if (stop && seatOf(g, id) < 0 && g.phase !== "result") msg = touchUI ? "Tap a free chair to run to it!" : "Click a free chair, or run there with WASD!";
  else if (seatOf(g, id) >= 0 && g.phase !== "over") msg = "You're safe this round!";
  $("msg").textContent = msg;
  const n = livePlayers().length;
  $("net").textContent = net.offline ? "Offline: playing with bots" : reconnecting ? "Reconnecting…" : `Online · ${n} player${n === 1 ? "" : "s"}${isHost() ? " · you run the music" : ""}`;
  $("bump").classList.toggle("wait", performance.now() < me.bumpReady);
  const over = g.phase === "over" && t - (g.ends - CONFIG.overMs) > 1500;

  if (over) results(g, t);
}
function results(g, t) {
  const id = net.sessionId, won = g.win === id, played = me.gameId === g.id && (won || g.outs.some((o) => o[0] === id));
  $("overTitle").textContent = won ? "You win! Last one sitting" : g.win ? `${g.winName || nameOf(g.win)} wins!` : "Game over";
  const mine = g.outs.find((o) => o[0] === id);
  $("overLine").textContent = won ? "Every chair, every round. Nice." : mine ? `You went out in round ${mine[2]}.` : "You'll play the next game.";
  const rows = [...(g.win ? [[g.win, g.winName || nameOf(g.win), "🏆"]] : []), ...[...g.outs].reverse().map(([i, n, r]) => [i, n, `round ${r}`])].slice(0, 12);
  $("results").innerHTML = rows.map(([i, n, v]) => `<li class="${i === id ? "me" : ""}">${esc(i === id ? "You" : n)}<span>${v}</span></li>`).join("");
  $("next").textContent = `Next game in ${Math.max(0, Math.ceil((g.ends - t) / 1000))}s`;
  if (boardFor !== g.id) { boardFor = g.id; showBoard(played && won && me.submitted !== g.id); me.submitted = g.id; }
}
function showBoard(won) {
  const list = $("board");
  if (!board) { list.innerHTML = "<li>Leaderboards need a connection.</li>"; return; }
  list.innerHTML = "<li>Loading…</li>";
  (won ? board.submit(1, "inc").catch(() => null) : Promise.resolve()).then(() => board.top(10)).then(({ entries }) => {
    list.innerHTML = entries.length ? entries.map((e) => `<li>${esc(e.username || "Player")}<span>${e.score} win${e.score === 1 ? "" : "s"}</span></li>`).join("") : "<li>No wins yet. Be the first.</li>";
  }).catch(() => { list.innerHTML = "<li>Couldn't load the leaderboard.</li>"; });
}
/** Keep a color nobody else has: the later sessionId gives way, and the bots' colors count as taken. */
function fixColor() {
  const others = Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId), bots = botList().map((b) => b.c);
  if (!others.some(([id, p]) => id < net.sessionId && p.c === myColor) && !bots.includes(myColor)) return;
  const used = new Set([...others.map(([, p]) => p.c), ...bots]);
  const free = COLORS.find((c) => !used.has(c));
  if (free && free !== myColor) { myColor = free; net.me.set("c", myColor); }
}
$("again").onclick = () => { const g = game(); if (!g || g.phase !== "over") return; if (isHost()) host.again = true; else net.send("again", {}); $("over").hidden = true; };

/** One-off effects worked out from what changed in state (so nobody misses one). */
let prevG = null, prevStop = false;
const prevAnim = new Map();
function effects(g, all, t) {
  const stop = stopped(g, t);
  if (stop && !prevStop && g.phase !== "result") { sfx("scratch"); bigText("SIT!", 900, false); }
  prevStop = stop;
  if (prevG && prevG.id === g.id) {
    const at = (id) => all.find((c) => c.id === id);
    if (prevG.r === g.r) for (const [c, who] of Object.entries(g.seat)) if (prevG.seat[c] !== who) {
      const p = chairPos(+c, g.chairs, g.seed); burst(p.x, p.y, [colorOf(who), "#ffffff", "#ffe066"], 14, 3);

    }
    if (g.phase === "result" && prevG.phase !== "result") for (const o of g.out) {

  }
  for (const c of all) { if (c.a === 4 && prevAnim.get(c.id) !== 4 && !c.mine) sfx("bonk"); prevAnim.set(c.id, c.a); }

}

// ── INPUT ───────────────────────────────────────────────────────────────────────────
const touchUI = matchMedia("(pointer: coarse)").matches && !ATTRACT;
$("bump").hidden = !touchUI;
if (touchUI) $("msg").style.bottom = "calc(max(18px, env(safe-area-inset-bottom)) + 120px)";
const keys = new Set(), ptr = { down: false, x: 0, y: 0, goal: null };
/** Screen point → floor point, through the camera that draws the frame. */
const toWorld = (sx, sy) => ({ x: cam.x + (sx - W / 2) / cam.z, y: cam.y + (sy - H / 2) / cam.z });
addEventListener("keydown", (e) => {
  keys.add(e.key.toLowerCase()); unlockAudio();
  if (e.key === " " || e.key === "Shift") { e.preventDefault(); bumpNow(); }
  if (e.key.startsWith("Arrow")) e.preventDefault();
});
addEventListener("keyup", (e) => keys.delete(e.key.toLowerCase()));
addEventListener("blur", () => { keys.clear(); ptr.down = false; });
const holding = () => ptr.down || [...keys].some((k) => k !== " " && k !== "shift");
function readInput() {
  const k = (a, b) => (keys.has(a) || keys.has(b) ? 1 : 0);
  const mx = k("d", "arrowright") - k("a", "arrowleft"), my = k("s", "arrowdown") - k("w", "arrowup");
  if (mx || my) { ptr.goal = null; const d = Math.hypot(mx, my); return { mx: mx / d, my: my / d }; }
  if (ptr.down) ptr.goal = toWorld(ptr.x, ptr.y);
  if (ptr.goal) { const g = game(); const c = g ? nearestFreeChair(g, ptr.goal) : -1; return { go: c >= 0 ? chairPos(c, g.chairs, g.seed) : ptr.goal }; } // tapped near a chair: run right onto it
  return { mx: 0, my: 0 };
}
function nearestFreeChair(g, p) { let best = -1, bd = 1.3; for (let c = 0; c < g.chairs; c++) { if (g.seat[c]) continue; const d = dist(p, chairPos(c, g.chairs, g.seed)); if (d < bd) { bd = d; best = c; } } return best; }
function bumpNow() {
  const g = game(); if (!g || !isIn(g, net.sessionId) || seatOf(g, net.sessionId) >= 0 || g.phase === "over") return;
  const sp = Math.hypot(me.vx, me.vy), dx = sp > 0.3 ? me.vx : Math.cos(me.h), dy = sp > 0.3 ? me.vy : Math.sin(me.h);
  if (startBump(me, performance.now(), dx, dy)) sfx("whoosh");
}
cv.addEventListener("contextmenu", (e) => e.preventDefault());
cv.addEventListener("pointerdown", (e) => {
  e.preventDefault(); unlockAudio();
  if (e.button === 2) { bumpNow(); return; }
  cv.setPointerCapture(e.pointerId);
  Object.assign(ptr, { down: true, x: e.clientX, y: e.clientY, goal: toWorld(e.clientX, e.clientY) }); // a quick tap still sets where to run
});
cv.addEventListener("pointermove", (e) => { ptr.x = e.clientX; ptr.y = e.clientY; });
for (const ev of ["pointerup", "pointercancel"]) cv.addEventListener(ev, () => { ptr.down = false; });
$("bump").addEventListener("pointerdown", (e) => { e.preventDefault(); e.stopPropagation(); unlockAudio(); bumpNow(); });
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
let last = performance.now(), lastHb = 0, lastHud = 0;
function frame(now) {
  requestAnimationFrame(frame);
  if (performance.now() - lastTick > 1000) { hostHold = performance.now() + 700; host.was = false; host.last = null; } // the tab was frozen or in the background: someone else may have hosted meanwhile, so let its state arrive, then adopt it
  lastTick = performance.now(); // not the rAF time: after a long freeze Chrome can stamp the first frame from before it ended
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now;
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); fixColor(); }
  if (isHost()) hostTick(dt, now); else host.was = false;
  const g = game();
  if (!g) { ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.fillStyle = "#3a2340"; ctx.fillRect(0, 0, W, H); return; }
  const t = Date.now();
  myTick(dt, g, now);
  if (!stopped(g, t)) { me.claimC = -1; ptr.goal = null; } // a new song: forget the last dash
  const all = drawn(g, now);
  effects(g, all, t);
  playMusic(g, t);

// Other players and (on non-hosts) bots arrive ~10–12 times a second. Draw them LAG ms in the past,
// between the two updates around that moment, so they glide instead of stepping.
const LAG = 150, tracks = new Map();
function drawn(g, now) {
  const out = [], host_ = isHost(), raw = S.shared.bots;
  for (const p of people(g)) {
    if (p.mine || (p.bot && host_)) { out.push(p); continue; }
    let tr = tracks.get(p.id);
    if (!tr) { tr = { raw: null, buf: [] }; tracks.set(p.id, tr); }
    const key = p.bot ? raw : S.entities.players[p.id]?.p;
    if (tr.raw !== key) {
      tr.raw = key;
      const lastB = tr.buf[tr.buf.length - 1];
      if (lastB && Math.hypot(lastB.x - p.x, lastB.y - p.y) > 4) tr.buf.length = 0;
      tr.buf.push({ at: now, x: p.x, y: p.y, h: p.h }); if (tr.buf.length > 10) tr.buf.shift();
    }
    const b = tr.buf, tt = now - LAG;
    let s = b[b.length - 1];
    for (let i = b.length - 1; i > 0; i--) { if (b[i - 1].at > tt) continue; const q0 = b[i - 1], q1 = b[i]; if (tt >= q1.at) { s = q1; break; } const k = (tt - q0.at) / Math.max(1, q1.at - q0.at); s = { x: q0.x + (q1.x - q0.x) * k, y: q0.y + (q1.y - q0.y) * k, h: q0.h + Math.atan2(Math.sin(q1.h - q0.h), Math.cos(q1.h - q0.h)) * k }; break; }
    if (b.length && tt <= b[0].at) s = b[0];
    out.push({ ...p, x: s.x, y: s.y, h: s.h });
  }
  return out;
}

(async function start() {
  net = await connect();
  net.onState((st) => { S = st; });
  net.on("sit", onSit);
  net.on("again", () => { const g = game(); if (isHost() && g && g.phase === "over") host.again = true; });
  net.onDisconnect(() => { reconnecting = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { reconnecting = false; });
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const taken = new Set(Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c));
  myColor = COLORS.find((c) => !taken.has(c)) || COLORS[Math.floor(Math.random() * COLORS.length)];
  net.me.set({ n: myName, c: myColor, hb: Date.now() });
  if (QS.has("test")) window.__test = { game, me, isHost, people: () => people(game()), stopped, cam, chairPos, seatOf }; // for test scripts only
  requestAnimationFrame(frame);
})();
</script>
